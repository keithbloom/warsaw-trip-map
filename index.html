<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warsaw Trip - January 2026</title>
    <script>
        // Authentication check - redirect to auth page if not authenticated
        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        const TRIP_KEY = 'warsaw2026family';
        if (getCookie('warsawTripAuth') !== TRIP_KEY) {
            // Get current path to construct auth.html URL
            const path = window.location.pathname;
            const basePath = path.substring(0, path.lastIndexOf('/') + 1);
            window.location.href = basePath + 'auth.html';
        }
    </script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🇵🇱 Warsaw Trip</h1>
            <div class="trip-dates">Thursday 8 - Sunday 11 January 2026</div>
        </header>

        <div class="mobile-toggle">
            <button id="show-map-btn" class="toggle-btn active">Map</button>
            <button id="show-list-btn" class="toggle-btn">Locations</button>
        </div>

        <div class="map-container">
            <div id="map">
                <div class="tile-selector">
                    <label for="tile-style">Map Style:</label>
                    <select id="tile-style">
                        <option value="osm">OpenStreetMap (Default)</option>
                        <option value="cartodb-positron">CartoDB Positron (Minimal)</option>
                        <option value="cartodb-voyager">CartoDB Voyager (Clean)</option>
                        <option value="cartodb-dark">CartoDB Dark</option>
                        <option value="esri-world">Esri World Street</option>
                    </select>
                    <button id="reset-zoom-btn" class="reset-zoom-btn">Reset Zoom</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="legend">
                    <h3 style="margin-bottom: 10px; font-size: 14px;">Legend</h3>
                    <div class="legend-item">
                        <span class="legend-icon">🏨</span>
                        <span>Hotel</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-icon">🏛️</span>
                        <span>Museum/Palace</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-icon">🍽️</span>
                        <span>Restaurant/Food</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-icon">☕</span>
                        <span>Café/Drinks</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-icon">🎭</span>
                        <span>Activity</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-icon">📍</span>
                        <span>Point of Interest</span>
                    </div>
                </div>
                
                <div class="section">
                    <div class="sidebar-header">
                        <h3>Select Two Locations</h3>
                        <button id="edit-mode-toggle" class="edit-mode-toggle">Edit Mode</button>
                    </div>
                    <div id="edit-mode-indicator" class="edit-mode-indicator" style="display: none;">
                        ✏️ EDIT MODE
                        <span id="unsaved-indicator" style="display: none;">• Unsaved changes</span>
                    </div>
                    <p style="font-size: 12px; color: #666; margin-bottom: 10px;">Click on locations below to calculate distance</p>
                    <div id="selection-controls" style="margin-bottom: 15px;"></div>
                    <div id="route-info-container"></div>
                    <div id="locations-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Location Management Modal -->
    <div id="location-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeLocationModal()">✕</button>
            <h3 id="modal-title">Add Location</h3>

            <form id="location-form" onsubmit="saveLocation(event)">
                <!-- Address Search -->
                <div class="form-group">
                    <label for="address-search">Search Address</label>
                    <div class="search-container">
                        <input type="text" id="address-search" placeholder="e.g., Copernicus Science Centre, Warsaw">
                        <button type="button" class="search-btn" onclick="searchAddress()">Search</button>
                    </div>
                    <div id="search-results" class="search-results"></div>
                    <div id="search-error" class="search-error"></div>
                </div>

                <!-- Location Details -->
                <div class="form-group">
                    <label for="location-name">Name *</label>
                    <input type="text" id="location-name" required>
                </div>

                <div class="form-group">
                    <label for="location-category">Category *</label>
                    <select id="location-category" required>
                        <option value="">Select category...</option>
                        <option value="hotel">Hotel</option>
                        <option value="museum">Museum/Palace</option>
                        <option value="restaurant">Restaurant</option>
                        <option value="cafe">Café</option>
                        <option value="activity">Activity</option>
                        <option value="poi">Point of Interest</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="location-icon">Icon (emoji) *</label>
                    <input type="text" id="location-icon" placeholder="🏛️" maxlength="2" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="location-lat">Latitude *</label>
                        <input type="number" id="location-lat" step="0.000001" min="-90" max="90" required>
                    </div>
                    <div class="form-group">
                        <label for="location-lng">Longitude *</label>
                        <input type="number" id="location-lng" step="0.000001" min="-180" max="180" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="location-url">Website URL</label>
                    <input type="url" id="location-url" placeholder="https://example.com">
                </div>

                <div class="form-group">
                    <label for="location-notes">Notes</label>
                    <textarea id="location-notes" rows="3" placeholder="Additional information"></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeLocationModal()">Cancel</button>
                    <button type="submit" class="btn-save">Save Location</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
